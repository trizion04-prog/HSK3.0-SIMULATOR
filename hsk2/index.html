const txt=t?`<span class="t">${pz(t[0],t[1])}${t[2]?`<span class="star">${pz(t[2],t[3])}</span>`:''}</span>`:'';
if(K=='pic3')return `<div class="q" id="q${n}">${no}<div class="opts">${'ABC'.split('').map(L=>btn(n,L,`<img src="img/q${n}${L}.jpg" alt="Gambar ${L}"><b>${L}</b>`,'pic')).join('')}</div></div>`;
if(K=='let6'||K=='let5'||K=='rad')return `<div class="q" id="q${n}">${no}${K=='rad'?`<img class="wbox" src="img/w${n}.png" alt="Kotak karakter soal ${n}">`:txt}<div class="opts l">${'ABCDEF'.slice(0,K=='let5'?5:6).split('').map(L=>btn(n,L,`<b>${L}</b>`)).join('')}</div></div>`;
if(K=='write')return `<div class="q" id="q${n}">${no}${txt}<label class="wr">Jawaban<input class="inp" data-n="${n}" maxlength="2" lang="zh" autocomplete="off" value="${esc(A[n]||'')}"></label></div>`;
return `<div class="q" id="q${n}">${no}${txt}<div class="opts">${OP[n].map((o,i)=>btn(n,'ABC'[i],`<b>${'ABC'[i]}</b>${pz(o[0],o[1])}`)).join('')}</div></div>`}
function bHTML(b){return `<section class="paper blk"><h2 class="zh">${b.title}</h2>${b.note?`<p class="note zh">${b.note}</p>`:''}${b.html||''}${b.qs.map(qHTML).join('')}</section>`}
function run(i){stage=i;const S=ST[i];
const dur=isFinite(au.duration)?Math.ceil(au.duration):1069;
end=Date.now()+(i==0?dur+180:S.min*60)*1000;
let c='';for(let n=S.a;n<=S.b;n++)c+=`<button class="chip${A[n]?' done':''}" id="c${n}" data-go="${n}">${n}</button>`;
app.innerHTML=`<header class="bar"><div class="row"><div class="nm"><b class="zh">${S.n}</b><small id="lab"></small></div><span class="tm" id="tm" role="timer">--:--</span><button class="fin" id="fin">Selesai bagian ini</button><button class="fin" id="pl" hidden>Putar audio</button></div><div class="chips">${c}</div></header>`+B.filter(b=>b.sec==i).map(bHTML).join('');
scrollTo(0,0);
$('#fin').onclick=function(){if(this.dataset.c)return next();this.dataset.c=1;this.textContent=(stage==0&&!au.ended)?'Audio akan berhenti. Klik lagi':'Yakin? Klik lagi';setTimeout(()=>{delete this.dataset.c;this.textContent='Selesai bagian ini'},4000)};
if(i==0){$('#pl').onclick=()=>{au.play();$('#pl').hidden=true};au.currentTime=0;au.play().catch(()=>{$('#pl').hidden=false})}
clearInterval(timer);timer=setInterval(tick,500);tick()}
function tick(){const s=Math.max(0,Math.round((end-Date.now())/1000)),t=$('#tm');if(!t)return;t.textContent=fmt(s);t.classList.toggle('low',s<180);
const lab=$('#lab');if(stage==0){lab.textContent=au.ended?'Audio selesai. Isi dan periksa jawabanmu.':'Audio sedang diputar'}else lab.textContent='Sisa waktu bagian ini';
if(s<=0)next()}
function next(){au.pause();clearInterval(timer);CERT.after(stage)!=null?run(CERT.after(stage)):result()}
app.addEventListener('click',e=>{const b=e.target.closest('.ch');if(b){const n=b.dataset.n;A[n]=A[n]==b.dataset.v?'':b.dataset.v;document.querySelectorAll(`.ch[data-n="${n}"]`).forEach(x=>x.classList.toggle('on',x.dataset.v==A[n]));mark(n);return}
const g=e.target.closest('[data-go]');if(g)$('#q'+g.dataset.go)?.scrollIntoView({behavior:'smooth',block:'start'})});
app.addEventListener('input',e=>{if(e.target.classList.contains('inp')){A[e.target.dataset.n]=e.target.value.trim();mark(e.target.dataset.n)}});
function mark(n){const c=$('#c'+n);if(c)c.classList.toggle('done',!!A[n])}
const ok=n=>(A[n]||'')==k(n);
const cnt=(a,b)=>{let c=0;for(let n=a;n<=b;n++)if(ok(n))c++;return c};
function result(){stage=3;const c1=cnt(1,25),c2=cnt(26,50),c3=cnt(51,60),tot=c1+c2+c3;let rows='';
for(let n=1;n<=60;n++)rows+=`<tr class="${ok(n)?'r-ok':'r-no'}"><td>${n}</td><td class="zh">${esc(A[n]||'–')}</td><td class="zh">${k(n)}</td><td>${ok(n)?'Benar':'Salah'}</td></tr>`;
app.innerHTML=`<section class="paper" id="res"><h2>Hasil ujian</h2><div class="sum" id="sum"><div class="card"><span class="zh">听力 Mendengarkan</span><b>${c1}/25</b>${c1*4}%</div><div class="card"><span class="zh">阅读 Membaca</span><b>${c2}/25</b>${c2*4}%</div><div class="card"><span class="zh">书写 Menulis</span><b>${c3}/10</b>${c3*10}%</div><div class="card"><span>Total</span><b>${tot}/60</b>${Math.round(tot/60*100)}%</div></div>
<p class="note">Persentase adalah perkiraan sederhana (jumlah benar dibagi jumlah soal), bukan konversi skor resmi HSK.</p></section>
<section class="paper"><h2>Lembar jawaban 1–60</h2><div class="tw"><table><thead><tr><th>No</th><th>Jawabanmu</th><th>Kunci</th><th>Hasil</th></tr></thead><tbody>${rows}</tbody></table></div><p><button class="go" onclick="location.reload()">Ulangi ujian</button></p></section>`;
scrollTo(0,0);send(c1,c2,c3);
CERT.finish();HSKLog.render($('#res'),{level:'HSK 2',name:U.nama,items:R(1,60).filter(n=>!ok(n)).map(n=>({q:n,section:PART(n),text:TX[n]?TX[n][1]+(TX[n][3]?' '+TX[n][3]:''):'',my:A[n],key:k(n)}))})}
function send(c1,c2,c3){const t1=Date.now(),
d={'form-name':'hasil-hsk2',nama:U.nama,kontak:U.kontak,mendengarkan:c1+'/25',membaca:c2+'/25',menulis:c3+'/10',total_otomatis:(c1+c2+c3)+'/60',
mulai:new Date(T0).toLocaleString('id-ID'),selesai:new Date(t1).toLocaleString('id-ID'),durasi_menit:String(Math.round((t1-T0)/60000)),
jawaban_1_60:R(1,60).map(n=>`${n}:${A[n]||'-'}${ok(n)?'✓':'✗'}`).join(' ')};
const m=document.createElement('p');m.className='sent';m.textContent='Mengirim hasil…';$('#sum').after(m);
fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(d).toString()})
.then(r=>{if(!r.ok)throw 0;m.textContent='✓ Hasil sudah terkirim ke guru.';m.style.color='var(--ok)'})
.catch(()=>{m.textContent='Hasil gagal terkirim. Screenshot halaman ini dan kirim ke guru.';m.style.color='var(--red)'})}
intro();
</script>
