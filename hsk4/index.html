CERT.setup({level:4,title:'HSK 4 · 样卷',sections:[{key:'L',zh:'听力',en:'Listening',stage:0,items:()=>CERT.items(1,32)},{key:'R',zh:'阅读',en:'Reading',stage:1,items:()=>CERT.items(33,64)},{key:'W',zh:'书写',en:'Writing',stage:2,items:()=>[...CERT.items(65,69,'check'),...CERT.items(70,70,'essay',80)]}]});
const PART=n=>n<=32?'Mendengarkan · Bagian '+(n<=14?1:2):'Membaca · Bagian '+(n<=42?1:n<=57?2:3);
const $=s=>document.querySelector(s),app=$('#app'),au=$('#au'),A={},M={};
let stage=-1,end=0,timer,U={nama:'',kontak:''},T0=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const zc=s=>(s.match(/[㐀-鿿]/g)||[]).length;
const btn=(n,v,l)=>`<button type="button" class="ch${A[n]==v?' on':''}" data-n="${n}" data-v="${v}"><b>${v}</b>${l?`<span class="zh">${l}</span>`:''}</button>`;
function intro(){app.innerHTML=`<a class="back" href="../">← Pilih level lain</a><section class="paper cover"><p class="zh">中文水平考试</p><h1 class="zh">HSK（四级）</h1><span class="seal zh">样卷</span>
<p>Simulasi ujian · 70 soal · sekitar 81 menit</p>
<ol><li><b>Mendengarkan</b> (soal 1–32): audio sekitar 21 menit diputar sekali dan tidak bisa dijeda, lalu 5 menit mengisi jawaban.</li><li><b>Membaca</b> (33–64): 30 menit.</li><li><b>Menulis</b> (65–70): 25 menit. Lima kalimat dari gambar dan satu karangan pendek (minimal 80 karakter).</li><li>Waktu habis, bagian berpindah otomatis. Bagian yang sudah lewat tidak bisa dibuka lagi.</li><li>Pakai headphone dan pastikan volume sudah pas sebelum mulai.</li></ol>
<div class="who"><label>Nama lengkap<input id="nm" autocomplete="name" required></label><label>WhatsApp / email (opsional)<input id="kt" autocomplete="email"></label></div>
${CERT.picker()}<button class="go" id="start" disabled>Mulai ujian</button></section>`;
const nm=$('#nm'),kt=$('#kt'),st=$('#start');nm.oninput=()=>st.disabled=!nm.value.trim();
st.onclick=()=>{U={nama:nm.value.trim(),kontak:kt.value.trim()};T0=Date.now();CERT.start();run(CERT.first())}}
function qHTML(n){const K=KIND[n]||{},no=`<b class="no">${n}</b>`;
if(n<=32)return `<div class="q" id="q${n}">${no}<div class="opts">${LO[n].map((o,i)=>btn(n,'ABCD'[i],o)).join('')}</div></div>`;
if(K.k=='fill')return `<div class="q" id="q${n}">${no}<span class="zh t" style="white-space:pre-line">${FILL[n]}</span><div class="opts l">${'ABCDEF'.split('').map(v=>btn(n,v)).join('')}</div></div>`;
if(K.k=='sent')return `<div class="q" id="q${n}">${no}<span class="t">Isi kotak ${n}</span><div class="opts l">${'ABCD'.slice(0,K.n).split('').map(v=>btn(n,v)).join('')}</div></div>`;
if(K.k=='sen')return `<div class="q" id="q${n}">${no}<div class="sen"><img src="img/w${n}.jpg" alt="Gambar soal ${n}"><div><span class="kw zh">${WORD[n]}</span><input class="sin zh" data-n="${n}" placeholder="用“${WORD[n]}”造句…" value="${esc(A[n]||'')}" autocomplete="off"></div></div></div>`;
const q=RQ[n];return `<div class="q" id="q${n}">${no}<div class="t">${K.k=='one'?`<div class="pass zh"><p>${PS[n]}</p></div>`:''}<span class="zh">${q[0]}</span></div><div class="opts">${q.slice(1).map((o,i)=>btn(n,'ABCD'[i],o)).join('')}</div></div>`}
function bHTML(b){let h=`<section class="paper blk"><h2 class="zh">${b.title}</h2>`;
if(b.note)h+=`<p class="note zh">${b.note}</p>`;
if(b.html)h+=b.html;
if(b.es)return h+`<textarea class="es" data-n="${b.es}" placeholder="在这里写短文…">${esc(A[b.es]||'')}</textarea><p class="wc"><span id="wc${b.es}">${zc(A[b.es]||'')}</span> / minimal ${b.min} karakter</p></section>`;
return h+b.qs.map(qHTML).join('')+'</section>'}
function run(i){stage=i;const S=ST[i];
const dur=isFinite(au.duration)?Math.ceil(au.duration):1269;
end=Date.now()+(i==0?dur+300:S.min*60)*1000;
let c='';for(let n=S.a;n<=S.b;n++)c+=`<button class="chip${A[n]?' done':''}" id="c${n}" data-go="${n}">${n}</button>`;
app.innerHTML=`<header class="bar"><div class="row"><div class="nm"><b class="zh">${S.n}</b><small id="lab"></small></div><span class="tm" id="tm" role="timer">--:--</span><button class="fin" id="fin">Selesai bagian ini</button><button class="fin" id="pl" hidden>Putar audio</button></div><div class="chips">${c}</div></header>`+B.filter(b=>b.sec==i).map(bHTML).join('');
scrollTo(0,0);
$('#fin').onclick=function(){if(this.dataset.c)return next();this.dataset.c=1;this.textContent=(stage==0&&!au.ended)?'Audio akan berhenti. Klik lagi':'Yakin? Klik lagi';setTimeout(()=>{delete this.dataset.c;this.textContent='Selesai bagian ini'},4000)};
if(i==0){$('#pl').onclick=()=>{au.play();$('#pl').hidden=true};au.currentTime=0;au.play().catch(()=>{$('#pl').hidden=false})}
clearInterval(timer);timer=setInterval(tick,500);tick()}
function tick(){const s=Math.max(0,Math.round((end-Date.now())/1000)),t=$('#tm');if(!t)return;t.textContent=fmt(s);t.classList.toggle('low',s<300);
const lab=$('#lab');if(stage==0){lab.textContent=au.ended?'Audio selesai. Isi dan periksa jawabanmu.':'Audio sedang diputar'}else lab.textContent='Sisa waktu bagian ini';
if(s<=0)next()}
function next(){au.pause();clearInterval(timer);CERT.after(stage)!=null?run(CERT.after(stage)):result()}
app.addEventListener('click',e=>{const b=e.target.closest('.ch');if(b){const n=b.dataset.n;A[n]=A[n]==b.dataset.v?'':b.dataset.v;document.querySelectorAll(`.ch[data-n="${n}"]`).forEach(x=>x.classList.toggle('on',x.dataset.v==A[n]));mark(n);return}
const g=e.target.closest('[data-go]');if(g)$('#q'+g.dataset.go)?.scrollIntoView({behavior:'smooth',block:'start'})});
app.addEventListener('input',e=>{const n=e.target.dataset.n;if(e.target.classList.contains('es')){A[n]=e.target.value;$('#wc'+n).textContent=zc(A[n]);mark(n)}else if(e.target.classList.contains('sin')){A[n]=e.target.value;mark(n)}});
app.addEventListener('change',e=>{if(e.target.dataset.m){M[e.target.dataset.m]=e.target.checked;wr()}});
function mark(n){const c=$('#c'+n);if(c)c.classList.toggle('done',!!(A[n]||'').trim())}
const ok=n=>A[n]==k(n);
const cnt=(a,b)=>{let c=0;for(let n=a;n<=b;n++)if(ok(n))c++;return c};
function wr(){const c=R(65,69).filter(n=>M[n]).length;$('#wsc').textContent=c+'/5'}
function result(){stage=3;const c1=cnt(1,32),c2=cnt(33,64);let rows='';
for(let n=1;n<=64;n++)rows+=`<tr class="${ok(n)?'r-ok':'r-no'}"><td>${n}</td><td>${A[n]||'–'}</td><td>${k(n)}</td><td>${ok(n)?'Benar':'Salah'}</td></tr>`;
const sens=R(65,69).map(n=>`<tr><td>${n}</td><td class="zh">${WORD[n]}</td><td class="zh">${esc((A[n]||'').trim()||'–')}</td><td class="zh">${REF[n]}</td><td><label><input type="checkbox" data-m="${n}"> Sesuai</label></td></tr>`).join('');
app.innerHTML=`<section class="paper" id="res"><h2>Hasil ujian</h2><div class="sum" id="sum"><div class="card"><span class="zh">听力 Mendengarkan</span><b>${c1}/32</b>${Math.round(c1/32*100)}%</div><div class="card"><span class="zh">阅读 Membaca</span><b>${c2}/32</b>${Math.round(c2/32*100)}%</div><div class="card"><span class="zh">写作 Menulis 65–69</span><b id="wsc">0/5</b>dinilai guru</div></div>
<p class="note">Persentase adalah perkiraan sederhana (jumlah benar dibagi jumlah soal), bukan konversi skor resmi HSK. Kalimat 65–69 dan karangan 70 dinilai guru: bandingkan dengan jawaban referensi lalu centang “Sesuai” jika kalimatnya benar dan memakai kata yang diminta.</p></section>
<section class="paper"><h2>Kalimat 65–69</h2><div class="tw"><table><thead><tr><th>No</th><th>Kata</th><th>Kalimatmu</th><th>Referensi</th><th>Nilai</th></tr></thead><tbody>${sens}</tbody></table></div>
<h3 class="zh">第 70 题 · ${zc(A[70]||'')} karakter</h3><div class="ess zh">${esc((A[70]||'').trim()||'–')}</div></section>
<section class="paper"><h2>Lembar jawaban 1–64</h2><div class="tw"><table><thead><tr><th>No</th><th>Jawabanmu</th><th>Kunci</th><th>Hasil</th></tr></thead><tbody>${rows}</tbody></table></div><p><button class="go" onclick="location.reload()">Ulangi ujian</button></p></section>`;
scrollTo(0,0);send(c1,c2);
CERT.finish();HSKLog.render($('#res'),{level:'HSK 4',name:U.nama,items:R(1,64).filter(n=>!ok(n)).map(n=>({q:n,section:PART(n),text:FILL[n]?FILL[n].replace(/\n/g,' '):RQ[n]?RQ[n][0].replace('★ ',''):'',my:A[n],key:k(n)}))})}
function send(c1,c2){const t1=Date.now(),
d={'form-name':'hasil-hsk4',nama:U.nama,kontak:U.kontak,mendengarkan:c1+'/32',membaca:c2+'/32',total_otomatis:(c1+c2)+'/64',
mulai:new Date(T0).toLocaleString('id-ID'),selesai:new Date(t1).toLocaleString('id-ID'),durasi_menit:String(Math.round((t1-T0)/60000)),
jawaban_1_64:R(1,64).map(n=>`${n}:${A[n]||'-'}${ok(n)?'✓':'✗'}`).join(' '),kalimat_65_69:R(65,69).map(n=>`${n} (${WORD[n]}): ${(A[n]||'-').trim()}`).join('\n'),esai_70:(A[70]||'').trim()};
const m=document.createElement('p');m.className='sent';m.textContent='Mengirim hasil…';$('#sum').after(m);
fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(d).toString()})
.then(r=>{if(!r.ok)throw 0;m.textContent='✓ Hasil sudah terkirim ke guru.';m.style.color='var(--ok)'})
.catch(()=>{m.textContent='Hasil gagal terkirim. Screenshot halaman ini dan kirim ke guru.';m.style.color='var(--red)'})}
intro();
</script><script src="/log.js"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))</script>
