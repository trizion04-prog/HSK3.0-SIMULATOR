<html lang="id" data-lv="1"><head><meta charset="utf-8">

<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0e5a63">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf1;--paper:#fff;--ink:#17212b;--mute:#5b6773;--line:#c8d0d8;--on:#0e5a63;--onbg:#dff0f2;--red:#b42318;--ok:#1b7a3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161c;--paper:#18212a;--ink:#e8edf1;--mute:#9aa7b3;--line:#33404c;--on:#5cc4cf;--onbg:#173238;--red:#ff8a7a;--ok:#6fd08c}}
:root[data-theme="dark"]{--bg:#10161c;--paper:#18212a;--ink:#e8edf1;--mute:#9aa7b3;--line:#33404c;--on:#5cc4cf;--onbg:#173238;--red:#ff8a7a;--ok:#6fd08c}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Public Sans",system-ui,sans-serif}
.zh{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
main{max-width:820px;margin:0 auto;padding:12px 12px 60px}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px 22px;margin:12px 0}
.cover{text-align:center;padding:40px 22px}
.cover h1{font-size:3rem;margin:.2em 0;letter-spacing:.08em}
.cover ol{text-align:left;max-width:540px;margin:20px auto}
.seal{display:inline-block;border:2px solid var(--red);color:var(--red);padding:2px 10px;border-radius:4px;font-weight:700}
.back{display:inline-block;margin-bottom:8px;color:var(--on)}
button{font:inherit;cursor:pointer}
.go{background:var(--on);color:var(--paper);border:0;border-radius:6px;padding:12px 28px;font-weight:700}
.go:disabled{opacity:.45;cursor:not-allowed}
.who{max-width:420px;margin:0 auto 18px;text-align:left;display:grid;gap:10px}.who label{display:grid;gap:4px;font-weight:600}.who input{font:inherit;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--on);padding:8px 12px}
.bar .row{max-width:820px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar .nm{flex:1;min-width:140px}.bar small{display:block;color:var(--mute)}
.tm{font:700 1.9rem/1 "Public Sans",sans-serif;font-variant-numeric:tabular-nums}.tm.low{color:var(--red)}
.fin{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 12px}
.chips{max-width:820px;margin:6px auto 0;display:flex;flex-wrap:wrap;gap:4px}
.chip{min-width:30px;height:26px;border:1px solid var(--line);background:none;color:var(--mute);border-radius:4px;font-size:.8rem;padding:0}
.chip.done{background:var(--on);border-color:var(--on);color:var(--paper)}
.blk h2{margin:0 0 4px;font-size:1.15rem}.note{color:var(--mute);margin:0 0 10px}
.pz{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.pz small{font-family:"Public Sans",sans-serif;color:var(--mute);font-size:.72rem}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:10px 0}
.imgs figure{margin:0;text-align:center;background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px}
.imgs img{max-width:100%;height:110px;object-fit:contain}.imgs figcaption{font-weight:700;color:#17212b}
.bank{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;padding:10px 14px;margin:8px 0;background:var(--bg);border-radius:6px}
.bank div{display:flex;gap:8px;align-items:flex-end}
.q{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.no{min-width:28px;font-variant-numeric:tabular-nums}
.t{flex:1 1 280px;font-size:1.08rem;display:flex;flex-direction:column;gap:6px}
.t .star{color:var(--mute)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;flex-basis:100%;padding-left:38px}
.opts.l{display:flex;flex-wrap:wrap}
.ch{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;min-height:44px;padding:6px 12px;text-align:left;display:flex;gap:8px;align-items:flex-end}
.opts.l .ch{min-width:46px;justify-content:center}
.ch.on{background:var(--on);border-color:var(--on);color:var(--paper)}.ch.on small{color:var(--paper)}
.ch.pic{flex-direction:column;align-items:center;background:#fff;color:#17212b;padding:6px}.ch.pic img{height:96px;max-width:100%;object-fit:contain}
.ch.pic.on{outline:3px solid var(--on);outline-offset:-3px;background:var(--onbg)}
:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:6px;padding:12px}.card b{font-size:1.8rem;display:block}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
.r-ok td:last-child{color:var(--ok)}.r-no td:last-child{color:var(--red)}
.tw{overflow-x:auto}.sent{font-weight:600}
</style>
<link rel="stylesheet" href="/theme.css"></head><body>
<form name="hasil-hsk1" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input name="bot-field"><input name="nama"><input name="kontak"><input name="mendengarkan"><input name="membaca"><input name="total_otomatis"><input name="mulai"><input name="selesai"><input name="durasi_menit"><textarea name="jawaban_1_40"></textarea>
</form>
<main id="app"></main>

<audio id="au" preload="auto" src="listening.mp3"></audio>
<script>
const KEY='CABAC'+'CAABC'+'EFBDA'+'ABCAC'+'FADBC'+'DECBA'+'FABCE'+'BBCCA';
const k=n=>KEY[n-1];
// [pinyin, hanzi]
const OP={
6:[['xīngqīsì','星期四'],['sān kuài qián','三块钱'],['wǔ kǒu rén','五口人']],
7:[['qiánbian','前边'],['zuò fàn','做饭'],['bú kèqi','不客气']],
8:[['bú huì','不会'],['xiě zì','写字'],['zuótiān wǎnshang','昨天晚上']],
9:[['hǎowánr','好玩儿'],['wán diànnǎo','玩电脑'],['shàng dàxué le','上大学了']],
10:[['Hànyǔ kè','汉语课'],['nán xuéshēng','男学生'],['wǒ yě bú rènshi','我也不认识']],
16:[['bìng le','病了'],['méi lái shàngxué','没来上学'],['bù xiǎng shuìjiào','不想睡觉']],
17:[['mài chē','卖车'],['dǎ diànhuà','打电话'],['zhǎo shǒujī','找手机']],
18:[['hěn xīn','很新'],['tài guì le','太贵了'],['bù hǎokàn','不好看']],
19:[['xuéxiào lǐbian','学校里边'],['yīyuàn hòubian','医院后边'],['chāoshì hòumiàn','超市后面']],
20:[['yí gè yuè','一个月'],['sān gè yuè','三个月'],['liù gè yuè','六个月']],
36:[['xiǎoxuéshēng','小学生'],['tā de jiārén','他的家人'],['tā nánpéngyou','他男朋友']],
37:[['shàngbān','上班'],['kàn diànyǐng','看电影'],['jiàn tóngxué','见同学']],
38:[['bāozi','包子'],['miànbāo','面包'],['miàntiáor','面条儿']],
39:[['','8:00'],['','9:00'],['','9:30']],
40:[['gōngzuò máng','工作忙'],['hái zài dúshū','还在读书'],['dào guówài le','到国外了']]};
const TX={
21:['Wáng xiānsheng, zàijiàn.','王先生，再见。'],22:['Dìdi hěn ài chàng gē.','弟弟很爱唱歌。'],23:['Zǎofàn chī jīdàn hé niúnǎi, zěnmeyàng?','早饭吃鸡蛋和牛奶，怎么样？'],24:['Jīntiān shì mèimei shàng xiǎoxué de dì-yī tiān.','今天是妹妹上小学的第一天。'],25:['Zǎoshang xià yǔ le, yǒudiǎnr lěng.','早上下雨了，有点儿冷。'],
26:['Tā shì shéi?','她是谁？'],27:['Duìbuqǐ.','对不起。'],28:["Nǐ nǚ'ér duō dà le?",'你女儿多大了？'],29:['Nǐ zěnme huí xuéxiào?','你怎么回学校？'],30:['Qǐngwèn, zhège diànshì duōshao qián?','请问，这个电视多少钱？'],
31:['Jīntiān shūdiàn li yǒu (　) duō xiǎopéngyǒu.','今天书店里有（　）多小朋友。'],32:['Tāmen (　) xuéle Zhōngwén.','他们（　）学了中文。'],33:['Wǒ juéde dì-èr gè bēizi (　), mǎi nàge ba.','我觉得第二个杯子（　），买那个吧。'],34:['Xiàkè, tóngxuémen (　) yíxià.','下课，同学们（　）一下。'],35:['A: Nǐ shuō shénme? Wǒ méi tīngjiàn.  B: Wǒ shuō, wǒ míngtiān báitiān yǒu (　), bù néng lái le.','A：你说什么？我没听见。　B：我说，我明天白天有（　），不能来了。'],
36:['Tā jiào Duōduo, shì wǒ de hǎopéngyou, yě shì wǒ de jiārén.','它叫多多，是我的好朋友，也是我的家人。','“Duōduo” shì:','★“多多”是：'],
37:['Wǒ xīngqītiān bú shàngbān, yào hé háizi qù kàn diànyǐng.','我星期天不上班，要和孩子去看电影。','Tā xīngqītiān yào:','★ 他星期天要：'],
38:['Māma zhōngwǔ zuòle miàntiáor, dàjiā dōu juéde hǎochī.','妈妈中午做了面条儿，大家都觉得好吃。','Dàjiā juéde shénme hǎochī?','★ 大家觉得什么好吃？'],
39:['Bā diǎn tài zǎo le, wǒmen jiǔ diǎn bàn jiàn ba.','八点太早了，我们九点半见吧。','Tā xiǎng jǐ diǎn jiàn?','★ 他想几点见？'],
40:['Wǒ jiějie shì yīshēng, tā gōngzuò hěn máng.','我姐姐是医生，她工作很忙。','Jiějie:','★ 姐姐：']};
const pz=(p,z)=>`<span class="pz">${p?`<small>${p}</small>`:''}<span class="zh">${z}</span></span>`;
const R=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const IMG=(pre,n)=>`<div class="imgs">${'ABCDEF'.slice(0,n).split('').map(L=>`<figure><img src="img/${pre}${L}.jpg" alt="Gambar ${L}"><figcaption>${L}</figcaption></figure>`).join('')}</div>`;
const BANK=a=>`<div class="bank">${a.map(x=>`<div><b>${x[0]}</b>${pz(x[1],x[2])}</div>`).join('')}</div>`;
const B=[
{sec:0,title:'第一部分',note:'第 1～5 题：听录音，选出正确的图片。',qs:R(1,5),kind:'pic3'},
{sec:0,title:'第二部分',note:'第 6～10 题：听录音，选出正确答案。',qs:R(6,10),kind:'op'},
{sec:0,title:'第三部分',note:'第 11～15 题：听对话，选出对应的图片。例如：你好！很高兴认识你。→ C',html:IMG('l',6),qs:R(11,15),kind:'let6'},
{sec:0,title:'第四部分',note:'第 16～20 题：听录音和问题，选出正确答案。',qs:R(16,20),kind:'op'},
{sec:1,title:'第一部分',note:'第 21～25 题：选出与句子对应的图片。例如：我很喜欢这本书。→ E',html:IMG('r',6),qs:R(21,25),kind:'let6'},
{sec:1,title:'第二部分',note:'第 26～30 题：选出合适的回答。例如：你喝水吗？→ F',html:BANK([['A','yuán.','2500 元。'],['B','Zuò chūzūchē.','坐出租车。'],['C','Shí suì le.','十岁了。'],['D','Wǒ nǚpéngyou.','我女朋友。'],['E','Méi guānxi.','没关系。'],['F','Hǎo de, xièxie!','好的，谢谢！']]),qs:R(26,30),kind:'let6'},
{sec:1,title:'第三部分',note:'第 31～35 题：选词填空。例如：你（D）什么名字？',html:BANK([['A','shàngwǔ','上午'],['B','piàoliang','漂亮'],['C','xiūxi','休息'],['D','jiào','叫'],['E','shì','事'],['F','hěn','很']]),qs:R(31,35),kind:'let6'},
{sec:1,title:'第四部分',note:'第 36～40 题：读句子，选出正确答案。',qs:R(36,40),kind:'op'}];
const KIND={};B.forEach(b=>b.qs.forEach(n=>KIND[n]=b.kind));
const ST=[{n:'听力 · Mendengarkan',a:1,b:20},{n:'阅读 · Membaca',a:21,b:40,min:20}];
CERT.setup({level:1,title:'HSK 1 · 样卷',sections:[{key:'L',zh:'听力',en:'Listening',stage:0,items:()=>CERT.items(1,20)},{key:'R',zh:'阅读',en:'Reading',stage:1,items:()=>CERT.items(21,40)}]});
const PART=n=>(n<=20?'Mendengarkan':'Membaca')+' · Bagian '+(((n-1)%20)/5+1|0);
const $=s=>document.querySelector(s),app=$('#app'),au=$('#au'),A={};
let stage=-1,end=0,timer,U={nama:'',kontak:''},T0=0;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const btn=(n,v,inner,cls='')=>`<button type="button" class="ch ${cls}${A[n]==v?' on':''}" data-n="${n}" data-v="${v}">${inner}</button>`;
function intro(){app.innerHTML=`<a class="back" href="../">← Pilih level lain</a><section class="paper cover"><p class="zh">中文水平考试</p><h1 class="zh">HSK（一级）</h1><span class="seal zh">样卷</span>
<p>Simulasi ujian · 40 soal · sekitar 36 menit</p>
<ol><li><b>Mendengarkan</b> (soal 1–20): audio sekitar 13 menit diputar sekali dan tidak bisa dijeda, lalu 3 menit mengisi jawaban.</li><li><b>Membaca</b> (21–40): 20 menit.</li><li>Waktu habis, bagian berpindah otomatis. Bagian yang sudah lewat tidak bisa dibuka lagi.</li><li>Pakai headphone dan pastikan volume sudah pas sebelum mulai.</li></ol>
<div class="who"><label>Nama lengkap<input id="nm" autocomplete="name" required></label><label>WhatsApp / email (opsional)<input id="kt" autocomplete="email"></label></div>
${CERT.picker()}<button class="go" id="start" disabled>Mulai ujian</button></section>`;
const nm=$('#nm'),kt=$('#kt'),st=$('#start');nm.oninput=()=>st.disabled=!nm.value.trim();
st.onclick=()=>{U={nama:nm.value.trim(),kontak:kt.value.trim()};T0=Date.now();CERT.start();run(CERT.first())}}
function qHTML(n){const K=KIND[n],no=`<b class="no">${n}</b>`,t=TX[n];
const txt=t?`<span class="t">${pz(t[0],t[1])}${t[2]?`<span class="star">${pz(t[2],t[3])}</span>`:''}</span>`:'';
if(K=='pic3')return `<div class="q" id="q${n}">${no}<div class="opts">${'ABC'.split('').map(L=>btn(n,L,`<img src="img/q${n}${L}.jpg" alt="Gambar ${L}"><b>${L}</b>`,'pic')).join('')}</div></div>`;
if(K=='let6')return `<div class="q" id="q${n}">${no}${txt}<div class="opts l">${'ABCDEF'.split('').map(L=>btn(n,L,`<b>${L}</b>`)).join('')}</div></div>`;
return `<div class="q" id="q${n}">${no}${txt}<div class="opts">${OP[n].map((o,i)=>btn(n,'ABC'[i],`<b>${'ABC'[i]}</b>${pz(o[0],o[1])}`)).join('')}</div></div>`}
function bHTML(b){return `<section class="paper blk"><h2 class="zh">${b.title}</h2>${b.note?`<p class="note zh">${b.note}</p>`:''}${b.html||''}${b.qs.map(qHTML).join('')}</section>`}
function run(i){stage=i;const S=ST[i];
const dur=isFinite(au.duration)?Math.ceil(au.duration):795;
end=Date.now()+(i==0?dur+180:S.min*60)*1000;
let c='';for(let n=S.a;n<=S.b;n++)c+=`<button class="chip${A[n]?' done':''}" id="c${n}" data-go="${n}">${n}</button>`;
app.innerHTML=`<header class="bar"><div class="row"><div class="nm"><b class="zh">${S.n}</b><small id="lab"></small></div><span class="tm" id="tm" role="timer">--:--</span><button class="fin" id="fin">Selesai bagian ini</button><button class="fin" id="pl" hidden>Putar audio</button></div><div class="chips">${c}</div></header>`+B.filter(b=>b.sec==i).map(bHTML).join('');
scrollTo(0,0);
$('#fin').onclick=function(){if(this.dataset.c)return next();this.dataset.c=1;this.textContent=(stage==0&&!au.ended)?'Audio akan berhenti. Klik lagi':'Yakin? Klik lagi';setTimeout(()=>{delete this.dataset.c;this.textContent='Selesai bagian ini'},4000)};
if(i==0){$('#pl').onclick=()=>{au.play();$('#pl').hidden=true};au.currentTime=0;au.play().catch(()=>{$('#pl').hidden=false})}
clearInterval(timer);timer=setInterval(tick,500);tick()}
function tick(){const s=Math.max(0,Math.round((end-Date.now())/1000)),t=$('#tm');if(!t)return;t.textContent=fmt(s);t.classList.toggle('low',s<180);
const lab=$('#lab');if(stage==0){lab.textContent=au.ended?'Audio selesai. Isi dan periksa jawabanmu.':'Audio sedang diputar'}else lab.textContent='Sisa waktu bagian ini';
if(s<=0)next()}
function next(){au.pause();clearInterval(timer);CERT.after(stage)!=null?run(CERT.after(stage)):result()}
app.addEventListener('click',e=>{const b=e.target.closest('.ch');if(b){const n=b.dataset.n;A[n]=A[n]==b.dataset.v?'':b.dataset.v;document.querySelectorAll(`.ch[data-n="${n}"]`).forEach(x=>x.classList.toggle('on',x.dataset.v==A[n]));mark(n);return}
const g=e.target.closest('[data-go]');if(g)$('#q'+g.dataset.go)?.scrollIntoView({behavior:'smooth',block:'start'})});
function mark(n){const c=$('#c'+n);if(c)c.classList.toggle('done',!!A[n])}
const ok=n=>A[n]==k(n);
const cnt=(a,b)=>{let c=0;for(let n=a;n<=b;n++)if(ok(n))c++;return c};
function result(){stage=2;const c1=cnt(1,20),c2=cnt(21,40),tot=c1+c2;let rows='';
for(let n=1;n<=40;n++)rows+=`<tr class="${ok(n)?'r-ok':'r-no'}"><td>${n}</td><td>${A[n]||'–'}</td><td>${k(n)}</td><td>${ok(n)?'Benar':'Salah'}</td></tr>`;
app.innerHTML=`<section class="paper" id="res"><h2>Hasil ujian</h2><div class="sum" id="sum"><div class="card"><span class="zh">听力 Mendengarkan</span><b>${c1}/20</b>${c1*5}%</div><div class="card"><span class="zh">阅读 Membaca</span><b>${c2}/20</b>${c2*5}%</div><div class="card"><span>Total</span><b>${tot}/40</b>${Math.round(tot/40*100)}%</div></div>
<p class="note">Persentase adalah perkiraan sederhana (jumlah benar dibagi jumlah soal), bukan konversi skor resmi HSK.</p></section>
<section class="paper"><h2>Lembar jawaban 1–40</h2><div class="tw"><table><thead><tr><th>No</th><th>Jawabanmu</th><th>Kunci</th><th>Hasil</th></tr></thead><tbody>${rows}</tbody></table></div><p><button class="go" onclick="location.reload()">Ulangi ujian</button></p></section>`;
scrollTo(0,0);send(c1,c2);
CERT.finish();HSKLog.render($('#res'),{level:'HSK 1',name:U.nama,items:R(1,40).filter(n=>!ok(n)).map(n=>({q:n,section:PART(n),text:TX[n]?TX[n][1]+(TX[n][3]?' '+TX[n][3]:''):'',my:A[n],key:k(n)}))})}
function send(c1,c2){const t1=Date.now(),
d={'form-name':'hasil-hsk1',nama:U.nama,kontak:U.kontak,mendengarkan:c1+'/20',membaca:c2+'/20',total_otomatis:(c1+c2)+'/40',
