{sec:0,title:'第一部分　1～10',note:'第 1～10 题：请选出正确答案。',qs:R(1,10)},

{sec:1,title:'第一部分　36～38',note:'第 36～45 题：请选出正确答案。',html:P(["近年来，人们的饮食观念在逐渐发生改变，越来越<span class=\"bl\">36</span>到健康饮食的重要性。“轻食”“少食”渐渐成为时尚，而吃自助餐往往和暴饮暴食联系在一起。一些注重口味的人，比起“吃到饱”，<span class=\"bl\">37</span>。他们喜欢某位厨师或是某种菜系的特殊味道，往往会认为吃自助餐是件“没有品位”的事。", "在一些美食爱好者的回忆中，吃自助餐仿佛是<span class=\"bl\">38</span>年轻时代的记忆，因为他们成年后就很少光顾自助餐了。他们说，那些酣畅淋漓的饮食，总是出现在青年时期的聚会上，回忆起吃自助餐，就能想起自己当年健康、旺盛的消化系统。"]),qs:[36,37,38]},
{sec:1,title:'39～41',html:P(["如今很多学校引进 AI（人工智能）作为助教，通过人机<span class=\"bl\">39</span>，帮助不同的孩子找到不同的学习节奏和方法。此外，AI 还可以提高教育评价的质量和效率。在传统的教学模式下，要做到即时评价对老师来说是很困难的。", "比如一个班级 50 个学生，学生今天做了作业交上来，老师批改好再发下去至少是明天了。老师虽然批改了，到课堂上可能也会去讲，但是学生的接受效果又得<span class=\"bl\">40</span>。有了 AI 后，就可以在学生学习的过程当中，<span class=\"bl\">41</span>，然后以最快的速度给出评价，再根据结果对学生进行个性化的教学。"]),qs:[39,40,41]},
{sec:1,title:'42～45',html:P(["中国的国家公园是在自然保护地的基础上发展起来的，从过去对<span class=\"bl\">42</span>生物群落的保护，发展到将山、水、林、田、湖、草、沙作为整体进行保护。2021 年进入中国第一<span class=\"bl\">43</span>国家公园名单的五个公园，都是生态功能保护的代表。", "1832 年，美国艺术家乔治·卡特林在旅行的路上，对美国西部大开发影响当地自然环境和野生动植物感到担忧，他认为“自然可以被保护起来……只要政府通过一些保护措施<span class=\"bl\">44</span>一个大公园，其中有人也有动物，一切都处于原生状态，<span class=\"bl\">45</span>”。40 年后，黄石国家公园成立，成为世界上第一个国家公园。之后，“国家公园运动”发展到全球 200 多个国家和地区，目前世界上已经有 3800 多个国家公园。"]),qs:[42,43,44,45]},
{sec:1,title:'第二部分　46～50',note:'第 46～55 题：下列语段的顺序已被打乱，请重新排序。46 是第一段，50 是最后一段。',ord:[["A", "公元 138 年，地动仪成功测到了陇西地震，当时洛阳的人们并没有感觉到地震，但几天后陇西的快马来报，证实那里确实发生了地震。这充分证明了地动仪的有效性。"], ["B", "地动仪的内部有一根铜柱，叫“都柱”。当地震发生时，地面震动，地动仪也会跟着晃动，但都柱由于惯性要保持原来的状态，因此会稍微慢于地动仪主体的运动。"], ["C", "张衡是东汉（25—220）时期著名的科学家，他发明的地动仪是世界上最早的地震监测仪器。地动仪大约两米高，整体形状像一个大酒樽。它的顶部微微隆起，周围分布着八条龙，分别代表东、南、西、北、东南、西南、东北、西北八个方向。"], ["D", "每条龙都张着大嘴，嘴里含着一颗铜球。龙嘴下方，对应着八只张着大嘴的蟾蜍，蟾蜍蹲在地上，抬头向着龙嘴，仿佛随时准备接住掉落的铜球。"], ["E", "这样，都柱就会倒向地震的方向，接触内部机关，那个方向的龙嘴就会张开，铜球正好掉进下边蟾蜍的嘴里，同时发出响声，这样人们就能知道地震的大概方向。"]],qs:R(46,50)},
{sec:1,title:'51～55',note:'51 是第一段，55 是最后一段。',ord:[["A", "厨师说：“老板，我们家里养的鸭子都只有一条腿！”老板很吃惊，但碍于客人在场，不便问个究竟。"], ["B", "某城市有个著名的厨师，他的拿手好菜是烤鸭，深受顾客的喜爱，特别是他的老板，心里对他更是赞赏有加。不过这个老板从来不在口头上给厨师任何鼓励，使得厨师整天闷闷不乐。"], ["C", "老板听后，便举手拍掌，吵醒鸭子。鸭子当场被惊醒，都站起来。老板说：“鸭子不全是两条腿吗？”厨师说：“对！对！不过，只有鼓掌拍手，才会有两条腿呀！”"], ["D", "有一天，老板有客人从远方来。他在家招待客人，点了数道菜，其中一道是老板最喜欢吃的烤鸭。然而，当老板夹了一条鸭腿给客人时，却找不到另一条鸭腿，他便问身后的厨师说：“另一条鸭腿到哪里去了？”"], ["E", "饭后，老板便跟着厨师到鸭笼去查个究竟。时值夜晚，鸭子正在睡觉，每只鸭子都只露了一条腿。厨师指着鸭子说：“老板，你看我们家的鸭子不全都是只有一条腿吗？”"]],qs:R(51,55)},
{sec:1,title:'第三部分　56～58',note:'第 56～70 题：请选出正确答案。',html:P(["<img src=\"img/p56.jpg\" alt=\"\">很多人眼中的财务自由，往往格外简单：有一定数量的钱，一生都花不完。许多理财专家都在为人们计算实现这样的财务自由具体需要多少钱。他们总是一厢情愿地计算出一个数字，甚至连怎么做都写清楚了，然而这对真正想要致富的人没有什么帮助。", "很明显，很多人所说的财务自由其实是指赚到很多钱，可以<u>一劳永逸</u>地生活。如果你眼中的财务自由是这样的，那么很可能一生都实现不了。财务自由不是不工作，而是逐渐不做低质量、低价值的工作。事实上，很多富豪、名人已经挣够了钱，即使他们已经退休，也仍然在工作，因为他们享受工作。他们从工作中不仅能获得乐趣，还能获得成就感，获得更多的财富。", "他们不仅不放弃工作，还愿意做更多的工作。有些企业经营者、管理者还兼职做产品经理，或跨界做兼职作家、讲师、演员、画家等。他们总是想要去尝试更多的职业，体验更多新的工作方式，这不仅是为了提升个人的能力，也是为了实现自身的价值。工作不是财务自由的敌人，而是财务自由的忠实伙伴。想要实现财务自由，就不要将学习、工作当成负担。否则，就会像许多古代皇帝一样，追求长生不老和安逸享乐，最后白白浪费了自己所拥有的能量。"]),qs:[56,57,58]},
{sec:1,title:'59～62',html:P(["<img src=\"img/p59.jpg\" alt=\"\">东晋（317—420）时期，谢安住在会稽东山的时候，经常和孙绰、王羲之等有名的文人一起坐船去海上玩。有一天，海上突然刮起大风，船晃得非常厉害。大家又害怕又着急，都喊着要回去，只有谢安表情平静，继续一边看风景一边写诗，好像什么都没发生。船夫看到他这么冷静，就继续往前划。等到风浪更大了，大家在船上已经吓得惊慌失措，谢安才慢慢地说：“要是大家这么慌张，我们肯定回不去。”这句话说完，大家慢慢安静下来，最后众人安全地回到了岸边。", "后来谢安当了东晋宰相。北方的苻坚气势汹汹地带领百万大军来进攻，谢安只说了一句话：“不要紧，我自有办法。”他的侄子谢玄一想，叔父什么风浪没见过，他既然<u>胸有成竹</u>，那自己放心就是了。谢玄带着军队出发后，谢安就去乡下休假了。", "谢安悠闲的样子给了谢玄很大的安全感。有一天，送信的人骑马跑来，报告谢玄胜利的消息。当时谢安正和客人下棋，他随便看了一眼报告，就把它放在一边。客人问：“有什么急事吗？”谢安慢慢回答：“没什么大不了的，孩子们把敌人打败了。”", "谢安在危险环境中能保持冷静，做到临危不乱，稳定了局势和人心，最终化解了危机，带来了胜利。"]),qs:[59,60,61,62]},
{sec:1,title:'63～66',html:P(["<img src=\"img/p63.jpg\" alt=\"\">在中国足球界，这两年来有一个很火的词——“苏超”，指的是江苏省城市足球联赛。2025 年 6 月以来，苏超引发全民关注。数据显示，本赛季苏超从第五轮起场均观众超 3 万人，带动赛场周边餐饮、住宿消费增长 40% 以上。苏超为什么能够爆火？原因值得分析和思考。", "从经济方面看，目前江苏省的 GDP 位居全国第二，省内的经济发展相对平衡，13 个市全部位列全国 GDP 百强，其中 5 座城市经济总量突破万亿人民币，使得各城市之间不存在绝对的中心—边缘结构。在这种条件下，各个城市的基础设施完善，都有拿得出手的体育场，也有比较好的足球基础。另外，江苏省还是全国高速公路密度最高的地区之一，13 个市也已经全部通动车，交通足够便利，省内人口跨市看足球比赛不是难题。经济发展到一定阶段，民众就会有消费娱乐需求。<u>苏超从出现到爆火，其实是水到渠成的</u>。", "在现代社会中，足球的社会功能往往被理解为“社区感”。每当说到欧洲足球的成功时，中国球迷总是十分羡慕。当地足球俱乐部与社区有一种地理上的联系，是人们集体情感与社区记忆的重要载体。可是在中国，社会巨大的流动性使得年轻人离开家乡，在不同的城市生活和工作，很难拥有“社区感”。苏超给人们提供了一个机会，以城市之名参加足球比赛，营造了一种强烈的城市共同体氛围，让很多居民首次体会到融入本地、为城市而战的激情之感。"]),qs:[63,64,65,66]},
{sec:1,title:'67～70',html:P(["<img src=\"img/p67.jpg\" alt=\"\">“日用类书”在明代（1368—1644）晚期大量出现，确实是一个有趣的现象。清代（1616—1911）初期的小说《醒世姻缘传》中有这么个情景：晁源是个没什么学问的富家子弟，一次他生病躺在床上，家人找了一位中医给他看病，需要找本书垫在手下。小说中提到了四本书，其中一本叫《万事不求人》，就属于晚明常见的日用类书。这种书的内容丰富多彩，从天文地理到饮食起居以及办事时候的处理方法等，应有尽有。总之，这种书对平常人生活中的一切小问题，都尽力给出解决方案，为人们的日常生活提供一些实用的指导。", "日用类书的大量出现和当时商业出版的发展有很大关系。明代中后期，随着印刷技术的普及和市场的发展，中国出现了一些出版基地，这些地方聚集了大量的出版商人、印刷工匠和流通网络，成为日用类书生产的中心地区。", "像晁源这样文化水平不高的人，手里有本《万事不求人》，就说明在当时日用类书的读者群体确实不小。历史学者认为这个读者群体主要包括工商阶层、城乡教师、女性读者，以及其他虽然受教育程度不高但有一些闲钱可以买书的人。他们的阅读期待推动了书商的出版行为，反过来，商业出版也在某种程度上重新构建了一个具有更广大人群的知识世界。"]),qs:[67,68,69,70]},
{sec:2,title:'第 71 题：看图写作',note:"请根据下面四张图，写一篇不少于 100 字的作文，写出发生在李明身上的故事。",img:'img/q71.jpg',es:71,min:100},
{sec:2,title:'第 72 题：话题作文',note:"有的年轻人认为“要对自己好一点儿”，鼓励消费；有的却认为“存钱才有安全感”。请写一篇不少于 200 字的作文，分享年轻人的消费观念以及你的看法。",es:72,min:200}];
const ST=[{n:'听力 · Mendengarkan',a:1,b:35},{n:'阅读 · Membaca',a:36,b:70,min:35},{n:'写作 · Menulis',a:71,b:72,min:40}];

const $=s=>document.querySelector(s),app=$('#app'),au=$('#au'),A={};
let AUD=false,AUDQ=35,LQ=0,stage=-1,end=0,timer,U={nama:'',kontak:''},T0=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const zc=s=>(s.match(/[㐀-鿿]/g)||[]).length;
const btn=(n,v,l)=>`<button type="button" class="ch${A[n]==v?' on':''}" data-n="${n}" data-v="${v}"><b>${v}</b>${l?`<span class="zh">${l}</span>`:''}</button>`;
function intro(){app.innerHTML=`<a class="back" href="/">← Pilih level lain</a><section class="paper cover"><p class="zh">中文水平考试</p><h1 class="zh">HSK（五级）</h1><span class="seal zh">全真模拟试卷 2</span>
<p>Simulasi ujian · 72 soal · sekitar 105 menit</p>
<ol><li><b>Mendengarkan</b> (soal 1–35): ${LQ>=35?`audio diputar sekali dan tidak bisa dijeda, lalu 5 menit mengisi jawaban.`:LQ?`audio saat ini baru mencakup <b>soal 1–${LQ}</b>. Soal ${LQ+1}–35 tetap ditampilkan, tapi belum ada audionya dan tidak dinilai.`:`<b>audio untuk tes ini belum tersedia.</b> Soal 1–35 tetap ditampilkan supaya lengkap (10 menit), tapi tidak dinilai.`}</li><li><b>Membaca</b> (36–70): 35 menit.</li><li><b>Menulis</b> (71–72): 40 menit, dua karangan (minimal 100 dan 200 karakter).</li><li>Waktu habis, bagian berpindah otomatis. Bagian yang sudah lewat tidak bisa dibuka lagi.</li><li>Pakai headphone dan pastikan volume sudah pas sebelum mulai.</li></ol>
<div class="who"><label>Nama lengkap<input id="nm" autocomplete="name" required></label><label>WhatsApp / email (opsional)<input id="kt" autocomplete="email"></label></div>
${CERT.picker()}<button class="go" id="start" disabled>Mulai ujian</button></section>`;
const nm=$('#nm'),kt=$('#kt'),st=$('#start');nm.oninput=()=>st.disabled=!nm.value.trim();
st.onclick=()=>{U={nama:nm.value.trim(),kontak:kt.value.trim()};T0=Date.now();CERT.start();run(CERT.first())}}
function qHTML(n,ord){
if(n<=35)return `<div class="q" id="q${n}"><b class="no">${n}</b><div class="opts">${LO[n].map((o,i)=>btn(n,'ABCD'[i],o)).join('')}</div></div>`;
if(ord)return `<div class="q" id="q${n}"><b class="no">${n}</b><span class="t">Paragraf ke-${n-(n>50?50:45)}</span><div class="opts l">${'ABCDE'.split('').map(v=>btn(n,v)).join('')}</div></div>`;
const q=RQ[n];return `<div class="q" id="q${n}"><b class="no">${n}</b>${q[0]?`<span class="zh t">${q[0]}</span>`:''}<div class="opts">${q.slice(1).map((o,i)=>btn(n,'ABCD'[i],o)).join('')}</div></div>`}
function bHTML(b){let h=`<section class="paper blk"><h2 class="zh">${b.title}</h2>`;
if(b.note)h+=`<p class="note zh">${b.note}</p>`;
if(b.html)h+=b.html;
if(b.ord)h+=b.ord.map(x=>`<div class="para zh"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
if(b.img)h+=`<img class="wimg" src="${b.img}" alt="Empat gambar cerita untuk soal 71">`;
if(b.es)return h+`<textarea class="es" data-n="${b.es}" placeholder="在这里写作文…">${esc(A[b.es]||'')}</textarea><p class="wc"><span id="wc${b.es}">${zc(A[b.es]||'')}</span> / minimal ${b.min} karakter</p></section>`;
return h+b.qs.map(n=>qHTML(n,!!b.ord)).join('')+'</section>'}
function run(i){stage=i;const S=ST[i];
const dur=isFinite(au.duration)?Math.ceil(au.duration):1592;
end=Date.now()+(i==0?(AUD?dur+300:600):S.min*60)*1000;
let c='';for(let n=S.a;n<=S.b;n++)c+=`<button class="chip${A[n]?' done':''}" id="c${n}" data-go="${n}">${n}</button>`;
app.innerHTML=`<header class="bar"><div class="row"><div class="nm"><b class="zh">${S.n}</b><small id="lab"></small></div><span class="tm" id="tm" role="timer">--:--</span><button class="fin" id="fin">Selesai bagian ini</button><button class="fin" id="pl" hidden>Putar audio</button></div><div class="chips">${c}</div></header>`+(i==0&&LQ<35?`<section class="paper"><p class="note" style="margin:0">${LQ?`Audio baru tersedia untuk soal 1–${LQ}. Soal ${LQ+1}–35 belum ada audionya dan tidak dinilai.`:`Audio untuk bagian ini belum tersedia. Soal ditampilkan supaya lengkap, tapi tidak dinilai.`}</p></section>`:'')+B.filter(b=>b.sec==i).map(bHTML).join('');
scrollTo(0,0);
$('#fin').onclick=function(){if(this.dataset.c)return next();this.dataset.c=1;this.textContent=(stage==0&&!au.ended)?'Audio akan berhenti. Klik lagi':'Yakin? Klik lagi';setTimeout(()=>{delete this.dataset.c;this.textContent='Selesai bagian ini'},4000)};
if(i==0&&AUD){$('#pl').onclick=()=>{au.play();$('#pl').hidden=true};au.currentTime=0;au.play().catch(()=>{$('#pl').hidden=false})}
clearInterval(timer);timer=setInterval(tick,500);tick()}
function tick(){const s=Math.max(0,Math.round((end-Date.now())/1000)),t=$('#tm');if(!t)return;t.textContent=fmt(s);t.classList.toggle('low',s<300);
const lab=$('#lab');if(stage==0&&!AUD){lab.textContent='Audio belum tersedia · tidak dinilai'}else if(stage==0){lab.textContent=au.ended?'Audio selesai. Isi dan periksa jawabanmu.':'Audio sedang diputar'}else lab.textContent='Sisa waktu bagian ini';
if(s<=0)next()}
function next(){au.pause();clearInterval(timer);CERT.after(stage)!=null?run(CERT.after(stage)):result()}
app.addEventListener('click',e=>{const b=e.target.closest('.ch');if(b){const n=b.dataset.n;A[n]=A[n]==b.dataset.v?'':b.dataset.v;document.querySelectorAll(`.ch[data-n="${n}"]`).forEach(x=>x.classList.toggle('on',x.dataset.v==A[n]));mark(n);return}
const g=e.target.closest('[data-go]');if(g)$('#q'+g.dataset.go)?.scrollIntoView({behavior:'smooth',block:'start'})});
app.addEventListener('input',e=>{if(e.target.classList.contains('es')){const n=e.target.dataset.n;A[n]=e.target.value;$('#wc'+n).textContent=zc(A[n]);mark(n)}});
function mark(n){const c=$('#c'+n);if(c)c.classList.toggle('done',!!(A[n]||'').trim())}
const ok=n=>A[n]==k(n);
const cnt=(a,b)=>{let c=0;for(let n=a;n<=b;n++)if(ok(n))c++;return c};
function result(){stage=3;const c1=cnt(1,LQ),c2=cnt(36,70);let rows='';
for(let n=1;n<=70;n++){const sk=n<=35&&n>LQ;rows+=`<tr class="${sk?'':ok(n)?'r-ok':'r-no'}"><td>${n}</td><td>${A[n]||'–'}</td><td>${k(n)}</td><td>${sk?'Tidak dinilai':ok(n)?'Benar':'Salah'}</td></tr>`}
const es=n=>`<h3 class="zh">第 ${n} 题 · ${zc(A[n]||'')} karakter</h3><div class="ess zh">${esc((A[n]||'').trim()||'–')}</div>`;
app.innerHTML=`<section class="paper" id="res"><h2>Hasil ujian</h2><div class="sum" id="sum"><div class="card"><span class="zh">听力 Mendengarkan</span>${LQ?`<b>${c1}/${LQ}</b>${Math.round(c1/LQ*100)}%${LQ<35?` · soal 1–${LQ}`:``}`:`<b>–</b>audio belum tersedia`}</div><div class="card"><span class="zh">阅读 Membaca</span><b>${c2}/35</b>${Math.round(c2/35*100)}%</div><div class="card"><span class="zh">写作 Menulis</span><b>–</b>dinilai guru</div></div>
<p class="note">Persentase adalah perkiraan sederhana (jumlah benar dibagi jumlah soal), bukan konversi skor resmi HSK. Karangan 71–72 dinilai oleh guru.</p></section>
<section class="paper"><h2>Karangan</h2>${es(71)}${es(72)}</section>
