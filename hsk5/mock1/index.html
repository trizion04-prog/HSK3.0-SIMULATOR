{sec:1,title:'39～41',html:P(["有的狗主人反映：“我的狗本来很乖，我也从来不惩罚它，但是狗突然有一天变得攻击性很强，我也不知道为什么。”这种情况应该如何解释呢？", "动物行为专家指出，<span class=\"bl\">39</span>。大部分主人的观察能力有限，也没有能力读出宠物的行为信号。要搞清楚狗狗行为变化的原因，需要观察宠物和主人的互动<span class=\"bl\">40</span>，识别宠物传递的各种信号。动物的行为是不会说谎的，经过这样的观察，宠物行为变化问题的答案就出来了。接下来就需要进行环境管理，帮助宠物离开创伤性环境。如果宠物的情绪持续焦虑，可能要使用药物进行<span class=\"bl\">41</span>。"]),qs:[39,40,41]},
{sec:1,title:'42～45',html:P(["我在买东西时一般都会<span class=\"bl\">42</span>挑选，看它们的质量如何、使用的材料对人体是否安全等等，除此之外还要考虑它的风格是否符合自己的品位：有的东西安全、耐用，价格也不贵，但如果有点儿“土”，<span class=\"bl\">43</span>。因为我认为，选择时尚的产品可以显示一个人的文化品位，而文化品位在某种程度上是社会地位的标志。", "正如美国记者大卫·马克斯在《地位与文化》一书中说的：“一个人的文化品位与他的社会地位相互关联……我们都<span class=\"bl\">44</span>较高的地位，因为它能带来他人的尊重，让我们更快乐。地位最高的是名人、有权势的人，大多数人位于中间位置。”“人类还善于把任何小优势<span class=\"bl\">45</span>为地位的标志。比如一口好牙，富人的嘴就是他们银行账户的窗户。”对此，你怎么看？"]),qs:[42,43,44,45]},
{sec:1,title:'第二部分　46～50',note:'第 46～55 题：下列语段的顺序已被打乱，请重新排序。46 是第一段，50 是最后一段。',ord:[["A", "三江并流区域最窄处，澜沧江和金沙江之间仅仅相隔 66 公里，而怒江和澜沧江之间的距离更是只有 18 公里，三江并流仿佛三条巨龙并肩前行，却又不相交汇，这种自然景观在全世界范围内都极为少见。"], ["B", "三江并流，指的是金沙江、澜沧江和怒江这三条大江在云南省境内自北向南并行奔流了 170 多公里的壮丽景象。"], ["C", "除了生态多样性，三江并流区域还具有深厚的文化价值，是多个民族共同生活的家园，保留着丰富多彩的传统文化。其独特的自然景观和重要的文化意义，成为全人类共同的宝贵财富。"], ["D", "尽管其面积不到云南省面积的 4.5%，仅占中国国土面积的 0.2%，但这里却有着极为丰富的生物资源，包括中国 20% 以上的植物种类和 25% 以上的动物种类。"], ["E", "另外，三江并流区域，山高谷深，地形复杂多变，千万年来形成了相对隔绝的自然环境。"]],qs:R(46,50)},
{sec:1,title:'51～55',note:'51 是第一段，55 是最后一段。',ord:[["A", "唐伯虎学习十分刻苦，每天除了吃饭睡觉，几乎所有的时间都用在了练习绘画上。"], ["B", "唐伯虎是明朝（1368—1644）著名的画家、文学家。他从小就对绘画十分感兴趣，并展现出了极高的天赋。为了在绘画领域取得更高的成就，他决定拜沈周为师，学习绘画。"], ["C", "沈周对他进行了严格的训练，从基本的笔法、墨法到构图、色彩，都一一耐心指导。"], ["D", "从此，唐伯虎收起了骄傲之心，更加虚心学画。他不断研究绘画技巧，广泛吸收前人的经验，最终成为中国绘画史上的一代大师。他的作品风格独特，题材广泛，对后世绘画产生了深远影响。"], ["E", "经过一段时间的学习，唐伯虎觉得自己进步很大，有些骄傲起来。一天，沈周请他吃饭，让他去开窗户。唐伯虎伸手去推窗户，却发现那窗户竟然是老师画在墙上的。他立刻羞愧不已，意识到自己与老师相比还有很大的差距。"]],qs:R(51,55)},
{sec:1,title:'第三部分　56～58',note:'第 56～70 题：请选出正确答案。',html:P(["<img src=\"img/p56.jpg\" alt=\"\">尼普曾经有过做明星的音乐梦想。高考前，他参加了全省的音乐统一考试，在 2000 多人中拿下了第二名的成绩，但音乐学院的学费让他为难了。考虑到弟弟妹妹还要上学，家里根本负担不起，他主动放弃了音乐梦，报考了广州的一所商学院，成了这个学校的第一批山区学生。", "常年的艰苦生活在尼普的面容上留下了许多痕迹。第一次上课，同学们都以为他是老师。后来真正的老师进了教室，让每个学生用 5 分钟介绍自己和家乡，他热情洋溢地一口气说了近 30 分钟，听得老师和台下的同学们都张大了嘴，大家都被尼普对家乡的感情深深感动了。", "四年的大学生活并不轻松，甚至困难重重。他所读的是电子商务专业，专业课上的很多名词他都听不太懂。到了英语课，他只认得个别单词，连张口都困难。经济上也是<u>囊中羞涩</u>。面对这些挑战，他没有退缩。课堂上他认真记录，课后反复查阅资料，向同学请教。为了提升英语水平，他坚持每天背诵单词和练习口语。同时，他利用课余时间从事兼职，既缓解了经济压力，也锻炼了自己。渐渐地，尼普的学习成绩变好了，整个人也变得更加自信开朗。"]),qs:[56,57,58]},
{sec:1,title:'59～62',html:P(["<img src=\"img/p59.jpg\" alt=\"\">《数学的发现》一书中说，高中课堂上的学生，未来的职业可能有三类：数学家、用到数学的人、不用数学的人。第一类人包括物理学家、天文学家、某些领域的工程师，他们只占学生比例的 1%，他们会用数学来思考。第二类是数学的应用者，而不是数学的生产者，这类人的占比为 29%。第三类基本上不会用到超过小学水平的数学，70% 的学生都属于这一类。老师要发现那 1%，对 29% 的学生进行技术训练。而能把常识教好也不容易，这是为 70% 以后用不到数学的人做一件有意义的事。", "大多数人成年之后不会用到小学水平以上的数学，一道初中数学题就可能难倒我们。但我们也需要具有数学思维。比如对大多数人来说，挣 100 块钱很容易，努力一下，挣 1 万块钱也不难。但是，挣 100 万就很难了，挣 1 亿元就难如登天了。1 万块与 100 块相比、100 万与 1 万块相比、1 亿元与 100 万相比，都是提升 100 倍，怎么挣钱的难度越来越高呢？这里面就涉及“数量级”的概念。如果画一个从 0 到 1 亿的数轴，再标出 100、1 万、100 万的位置，我们会发现，这三个点都在 0 附近，离 1 亿非常非常远。也就是说，从乘法来看 100、1 万、100 万、1 亿之间的倍数关系是相等的，但其实这四个数之间的距离差别巨大。在日常生活中，“数量级”概念的应用也很常见。比如，在描述人口数量时，会说某个城市的人口是百万级别或千万级别的；在描述收入时，会说某个人的年收入是十万级别或百万级别的。"]),qs:[59,60,61,62]},
{sec:1,title:'63～66',html:P(["<img src=\"img/p63.jpg\" alt=\"\">2023 年的春节，我回家过年，整个车里堆满了年货。按往年的习惯，父亲早就站在楼门口迎出来，一边笑呵呵地抱怨我又乱买东西，一边动手帮我一起搬。但这一次，他并没有出来。我远远地见他站在窗后，隔着玻璃望向我，脸上没什么表情，直到我抬头，他才稍微点了点头，算是打过招呼。", "在厨房做饭的母亲悄悄把我拉进去，小声说：“你爸退休后心情不好，千万别惹他。”晚饭时，我主动说起一些趣事，可是父亲完全不理我，平时挺爱开玩笑的他，脸上一直是凝重的表情。", "饭刚吃到一半，他突然发起脾气来：“你一年才回来几次？”“谁像你这样完全不照顾父母的感受？”“人到什么年纪就该做什么事！”<u>我们的对话就像一场激烈的网球比赛，他问一句，我回一句</u>。最后，父亲的话像一记扣杀，结束了这场比赛：“我不想看见你了，你回家自己过节去吧！”我也没有犹豫，站起来推门而出。没有回头看父亲愤怒的脸，也没有安慰流泪的母亲。那一刻，安静的客厅里只留下一扇仍在晃动的门。", "开车回家的路上，我突然想起很多年前在奶奶家，父亲也曾这样突然离开。起因似乎是奶奶在饭桌上埋怨他只顾工作，很少回家，但就这么一句话，竟让他觉得彻底不被理解。", "如今，父亲成了奶奶那时的样子，我也成了父亲那时的样子。"]),qs:[63,64,65,66]},
{sec:1,title:'67～70',html:P(["<img src=\"img/p67.jpg\" alt=\"\">医院中的老年科是看什么病的？这是一个经常被问到的问题。因为西医把身体分成不同的器官和系统，比如病人心脏有问题，就去挂心内科的号。但人到了老年阶段，很多情况下很难从主观上判断问题出在什么地方。比如说，胸疼，有可能是心脏的问题，也可能是呼吸的问题，也可能是胃部的问题，甚至可能是皮肤的问题。", "另外一种情况是，老年人的不舒服往往是很多因素综合导致的，不一定是某一个器官出了问题。那么针对老年群体，<u>就不能够头疼医头，脚疼医脚</u>，这也是中医诊疗的一贯主张。甚至有一些不舒适可能不是身体的问题，心理情绪也会有躯体化的表现，需要综合判断。", "也有可能某些老年人并不是“病了”，而是“老了”。这种情况也需要去老年科进行咨询。如果把高血压视为疾病的话，那么在 80 岁以上的老人里可能很难找到一个完全没有病的。如今有一种看法认为，健康不应以年龄大小、是否有疾病来定义，而是应以功能作为最主要的切入点。尽管一个老年人有疾病，年龄也很大，但是他能够自理，心理情绪也没有太大的问题，还能积极地参与社会交往并体现社会价值，这就是健康的。"]),qs:[67,68,69,70]},
{sec:2,title:'第 71 题：看图写作',note:"请根据下面四张图，写一篇不少于 100 字的作文，写出这一天发生在张华身上的故事。",img:'img/q71.jpg',es:71,min:100},
{sec:2,title:'第 72 题：话题作文',note:"中国有句话是“绿水青山就是金山银山”，意思是好的自然环境（绿水、青山）是像金银一样宝贵的财富资源，甚至能创造更大的价值。请写一篇不少于 200 字的作文，结合这句话谈谈你对环境保护的看法。",es:72,min:200}];

效果每次都不错。有一次老师留她在办公室，问她是怎样把课文背下来的。她说：“背课文太枯燥了，我把课文当成歌词，再编成歌曲唱出来。”然后她在办公室当着众多老师的面这样做了。老师问她：“那你平时都是把每篇课文都唱出来的吗？真棒！”对于背课文，王月不但不觉得难，反而觉得很有意思。她经常把课文编成歌曲，还教给大家。事实证明，全班同学的背诵能力明显提升。据说，丰子恺先生的读书方法叫作“22 遍读书法”，他对一篇好文章，会前后读 22 遍之多。他深有体会地说，把文章读熟后，自然就能背下来。当然，对现在的孩子们来说，靠心到、眼到、口到来背诵有难度，因为分散注意力的事物毕竟太多了。","s":null,"e":null,"i":105},{"q":20,"spk":"","t":"20. 王月用什么方法背课文？","s":null,"e":null,"i":106},{"q":21,"spk":"","t":"21. 根据丰子恺先生的方法，背诵课文的关键是什么？","s":null,"e":null,"i":107},{"q":22,"spk":"","t":"第 22 到 24 题是根据下面一篇短文：","s":null,"e":null,"i":108},{"q":22,"spk":"","t":"中国人很注重孩子在音乐方面的培养，这来自对中国传统文化深层次的认识。孔子说过，对孩子的培养要“兴于诗”，然后“成于乐”。意思是用诗来使孩子了解各种情感，用音乐来完善他们的人生。可见音乐对孩子来说，不仅仅是一个兴趣爱好，更重要的是可以培养孩子的性格。一个中国家庭如果面临音乐、体育和美术三方面的教育选择，绝大多数家庭还是会在收入允许的情况下首先选择音乐方面，这一点是和西方人思维不一样的。其实从功利的角度讲，音乐方面的特长很难让学生在升学考试中加分，这会让一些孩子成长到初、高中阶段放弃对音乐的学习。但在孩子的幼儿阶段，家长一般还是会选择音乐对孩子进行素质教育。","s":null,"e":null,"i":109},{"q":22,"spk":"","t":"22. 这段话从哪个角度说明中国人重视音乐教育？","s":null,"e":null,"i":110},{"q":23,"spk":"","t":"23. 中国人和西方人在哪个方面观念不同？","s":null,"e":null,"i":111},{"q":24,"spk":"","t":"24. 中国家庭一般在什么时候对孩子进行音乐教育？","s":null,"e":null,"i":112},{"q":25,"spk":"","t":"第 25 到 26 题是根据下面一篇短文：","s":null,"e":null,"i":113},{"q":25,"spk":"","t":"中国第七次人口普查统计中国总人口为 14.43 亿人。大陆 31 个省份中，超过 1 亿人的省份有广东省和山东省，河南省人口 0.99 亿，排名第三。从年龄结构上看，15—59 岁人口数量最多，为 8.94 亿人，占比 63%。性别结构方面，男性人口为 7.23 亿人，占比 51%；女性人口为 6.88 亿人，占比 49%。民族人口中，汉族人口占绝大多数，为 12.86 亿人。教育程度上，大学文化程度人口为 2.18 亿人。区域分布上，东部地区人口最为密集，有 5.64 亿人，占比 40%；中部地区人口与西部地区人口分别占比 26% 和 27%；东北地区人口占比 7%。总体来看，中国人口呈现出多样化特征。","s":null,"e":null,"i":114},{"q":25,"spk":"","t":"25. 根据这段话，中国男性人口有多少？","s":null,"e":null,"i":115},{"q":26,"spk":"","t":"26. 关于中国人口的区域分布，下列哪一项正确？","s":null,"e":null,"i":116},{"q":27,"spk":"","t":"第 27 到 29 题是根据下面一篇短文：","s":null,"e":null,"i":117},{"q":27,"spk":"","t":"公元 759 年农历十月，唐代诗人杜甫带着家人从秦州出发，一路饱受严寒之苦，最后终于到达了成都。成都舒适、随性的城市文化对杜甫的诗歌主题和风格产生了重大影响。杜甫在成都前后三年多，写了 200 多首诗；在整个四川境内写了将近 500 首诗，占他全部诗的三分之一。其中，有很多是以前从来没有写过的主题，充满新鲜感的杜甫用诗记录下了四川独特的自然特色和社会风俗，最典型的就是《春夜喜雨》这首诗。成都夜里经常下雨，白天雨就停了，所以四川传统里有一种传说，说老天爷喜爱四川：农业生产需要雨，但下雨又会影响人们出门娱乐，于是老天爷决定白天不下雨，只晚上下雨，这样种粮食和娱乐都不会耽误。杜甫从一个北方人的角度把四川最平常的事情记录在了诗里。","s":null,"e":null,"i":118},{"q":27,"spk":"","t":"27. 成都对杜甫的诗有什么影响？","s":null,"e":null,"i":119},{"q":28,"spk":"","t":"28. 《春夜喜雨》这首诗反映了成都的什么特点？","s":null,"e":null,"i":120},{"q":29,"spk":"","t":"29. 这段话主要想告诉我们什么？","s":null,"e":null,"i":121},{"q":30,"spk":"","t":"第 30 到 32 题是根据下面一篇短文：","s":null,"e":null,"i":122},{"q":30,"spk":"","t":"接近 80% 的年轻人会在出门时携带水杯。欧洲医学教授博福特说：“学生们不仅仅是想保持健康，他们也想展现出健康的样子。此时水杯甚至成了一种身份的象征。”很多人认为不渴的时候也可以喝点儿水，因为喝水有助于获得好的皮肤和保持头脑灵活。而且一个杯子的售价相对来说还是比较高的，咖啡馆时尚的超大保温杯一个要 200 多元。于是杯子制造商不断推出各种颜色和款式的水杯。打个比方，对一些视频平台的老板来说，他们唯一感到遗憾的是人们一天只有 24 小时，没法拿出更多的时间观看视频，那么杯子制造商估计感到遗憾的是人们的肚子只有那么大，喝不下更多的水。","s":null,"e":null,"i":123},{"q":30,"spk":"","t":"30. 年轻人出门为什么喜欢带水杯？","s":null,"e":null,"i":124},{"q":31,"spk":"","t":"31. 年轻人的水杯有什么特点？","s":null,"e":null,"i":125},{"q":32,"spk":"","t":"32. 关于水杯制造商，可以知道什么？","s":null,"e":null,"i":126},{"q":33,"spk":"","t":"第 33 到 35 题是根据下面一篇短文：","s":null,"e":null,"i":127},{"q":33,"spk":"","t":"从前，有个人养了一群羊。一天早上，他去放羊，发现少了一只。仔细一看，羊圈破了个洞，应该是夜里狼从洞外爬进来，把羊叼走了。邻居劝他说：“赶快把羊圈修一修，堵上那个大洞吧。”他说：“羊已经丢了，还修羊圈干什么呢？”他没接受邻居的建议。第二天早上，他去放羊，发现又少了一只羊。原来狼又从洞外爬进去，把羊叼走了。他很后悔没有听邻居的话，心想，现在修还不晚。他赶紧堵上了那个洞，把羊圈修得结结实实的。从此，他的羊再也没丢过。这个故事告诉我们，出了问题以后想办法补救，可以防止继续受损失。做错了事不要紧，只要及时改正，就不算晚。","s":null,"e":null,"i":128},{"q":33,"spk":"","t":"33. 这个人一共丢了几只羊？","s":null,"e":null,"i":129},{"q":34,"spk":"","t":"34. 邻居的建议是什么？","s":null,"e":null,"i":130},{"q":35,"spk":"","t":"35. 这段话主要想告诉我们什么？","s":null,"e":null,"i":131},{"q":35,"spk":"","t":"听力考试现在结束。","s":null,"e":null,"i":132}];
